# ZimaOS Card 1: PostgreSQL Produção (:5432 - Banco Oficial natumhub)
services:
  postgres-prod:
    image: postgres:17-alpine
    container_name: nexus-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: natumhub
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - /DATA/AppData/nexus/pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d natumhub"]
      interval: 10s
      timeout: 5s
      retries: 5
