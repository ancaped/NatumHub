# Nexus Industrial Hub - Docker Compose para ZimaOS / Servidor Linux
#
# Arquitetura Dual + ai-memory:
#   - PRODUÇÃO:        nexus-prod (:3001)       + nexus-postgres-prod (:5432)
#   - DESENVOLVIMENTO: nexus-dev (:3002)     + nexus-postgres-dev (:5433)
#   - AI-MEMORY:       nexus-ai-memory (:49374) (Servidor de memória contínua para IAs)
#   - MONITORAMENTO:    nexus-pgadmin (:5050)  (inspeciona os 2 bancos)
#
# Diretório padrão de persistência no ZimaOS: /DATA/AppData/
# (Pode ser sobrescrito definindo DATA_ROOT no arquivo .env)

services:
  # ==========================================
  # 1. BANCOS DE DADOS POSTGRESQL (ISOLADOS)
  # ==========================================

  # Banco Oficial da Fábrica (Produção)
  postgres-prod:
    image: postgres:17-alpine
    container_name: nexus-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: natumhub
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_ROOT:-/DATA/AppData}/nexus/pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d natumhub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  # Banco de Testes e Desenvolvimento (Espelho isolado para o Beta)
  postgres-dev:
    image: postgres:17-alpine
    container_name: nexus-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: natumhub_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ${DATA_ROOT:-/DATA/AppData}/nexus/pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d natumhub_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  # ==========================================
  # 2. APLICAÇÕES NEXUS (PROD VS DEV)
  # ==========================================

  # Servidor de Produção (Acessado pelos Clientes e Fábrica 24/7)
  nexus-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nexus:prod
    container_name: nexus-prod
    restart: always
    depends_on:
      postgres-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-prod:5432/natumhub
      NEXUS_DATA_DIR: /opt/nexus/Saves
      NEXUS_FRONTEND_DIST: /opt/nexus/Frontend/dist
      RUST_LOG: info
    ports:
      - "3001:3001"
    volumes:
      - ${DATA_ROOT:-/DATA/AppData}/nexus/saves-prod:/opt/nexus/Saves
    networks:
      - nexus-net

  # Servidor de Desenvolvimento / Beta (Conectado aos Agentes de IA)
  nexus-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nexus:dev
    container_name: nexus-dev
    restart: unless-stopped
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-dev:5432/natumhub_dev
      NEXUS_DATA_DIR: /opt/nexus/Saves
      NEXUS_FRONTEND_DIST: /opt/nexus/Frontend/dist
      RUST_LOG: debug
    ports:
      - "3002:3001"
    volumes:
      - ${DATA_ROOT:-/DATA/AppData}/nexus/saves-dev:/opt/nexus/Saves
    networks:
      - nexus-net

  # ==========================================
  # 3. AI-MEMORY (MEMÓRIA COMPARTILHADA DAS IAS)
  # ==========================================

  ai-memory:
    image: akitaonrails/ai-memory:latest
    container_name: nexus-ai-memory
    restart: unless-stopped
    command: ["serve", "--transport", "http", "--enable-web"]
    environment:
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN:-nexus-memory-token-secret}
      AI_MEMORY_ALLOWED_HOSTS: ${AI_MEMORY_ALLOWED_HOSTS:-192.168.122.196,nexus.local,localhost,127.0.0.1}
      AI_MEMORY_DATA_DIR: /data
    ports:
      - "49374:49374"
    volumes:
      - ${DATA_ROOT:-/DATA/AppData}/ai-memory/data:/data
    networks:
      - nexus-net

  # ==========================================
  # 4. MONITORAMENTO E INSPEÇÃO (OPCIONAL)
  # ==========================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexus-pgadmin
    restart: unless-stopped
    depends_on:
      postgres-prod:
        condition: service_healthy
      postgres-dev:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nexus.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - ${DATA_ROOT:-/DATA/AppData}/nexus/pgadmin:/var/lib/pgadmin
    networks:
      - nexus-net

# ==========================================
# 5. REDE INTERNA DOCKER
# ==========================================
networks:
  nexus-net:
    driver: bridge
