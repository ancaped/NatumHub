# Compila, testa e publica a imagem do Nexus no GHCR. O servidor (ZimaOS) NUNCA compila: o autodeploy
# só puxa a imagem pronta (ghcr.io/ancaped/nexus:sha-<7 do commit>), troca o container e roda os smoke tests.
name: Build e imagem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/ancaped/nexus

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Postgres de teste: as migrações e os testes `#[ignore]` (NEXUS_TEST_DATABASE_URL) rodam contra ele.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: natumhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Frontend (build)
        working-directory: Frontend
        run: |
          npm ci
          npm run build
          npm run test:unit

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend

      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Backend (testes)
        working-directory: Backend
        run: cargo test --no-default-features

      # Migrações na mesma ordem do SCHEMA_FILES (postgres_bootstrap/commands.rs), num banco vazio.
      - name: Banco de teste (migrações)
        working-directory: Backend
        env:
          PGPASSWORD: postgres
        run: |
          grep -oE '"[0-9A-Za-z_]+\.sql"' src/modules/geral/postgres_bootstrap/commands.rs | tr -d '"' | awk '!seen[$0]++' |
          while read -r f; do
            psql -h localhost -U postgres -d natumhub_test -v ON_ERROR_STOP=1 -q -f "supabase/$f"
          done

      # Testes que precisam de banco. test_dump_execution precisa do SQL Server do ERP e fica de fora.
      - name: Backend (testes com banco)
        working-directory: Backend
        env:
          NEXUS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/natumhub_test
        run: cargo test --no-default-features --lib -- --ignored --test-threads=1 --skip tests::test_dump_execution

  image:
    name: Imagem (GHCR)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão
        id: ver
        run: |
          echo "version=0.2.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            CARGO_JOBS=4
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.ver.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
