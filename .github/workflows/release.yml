name: Release NatumHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da release (ex. v0.0.12). Obrigatório no dispatch manual.'
        required: true
        type: string
      release_notes:
        description: 'Notas da versão (opcional)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'feat/update-channels-ci' || github.ref }}

      - name: Detect version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if echo "$TAG" | grep -qiE 'alpha|beta'; then
            echo "Tags alpha/beta não são mais suportadas. Use vX.Y.Z (Estável)."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="NatumHub $VERSION"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Sync version in project files
        shell: node
        run: |
          const fs = require('fs');
          const v = '${{ steps.meta.outputs.version }}';
          const tauriPath = 'Backend/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = v;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');
          for (const p of ['Frontend/package.json', 'Backend/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = v;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          }
          let cargo = fs.readFileSync('Backend/Cargo.toml', 'utf8');
          cargo = cargo.replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('Backend/Cargo.toml', cargo);

      - name: Apply stable release config
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-channel-config.mjs --channel stable --tag ${{ steps.meta.outputs.tag }}

      - name: Apply updater public key
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/apply-updater-pubkey.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install backend (Tauri CLI) dependencies
        run: npm ci
        working-directory: Backend

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Backend
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: NatumHub ${{ steps.meta.outputs.tag }}
          releaseBody: ${{ steps.meta.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Locate updater signature
        id: sig
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $patterns = @(
            "Backend/target/release/bundle/updater/*.sig",
            "Backend/target/x86_64-pc-windows-msvc/release/bundle/updater/*.sig"
          )
          $sig = $null
          foreach ($p in $patterns) {
            $found = Get-ChildItem -Path $p -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $sig = $found.FullName; break }
          }
          if (-not $sig) {
            Write-Warning "Arquivo .sig não encontrado — manifest ficará com signature vazia até configurar TAURI_SIGNING_PRIVATE_KEY"
            "path=" >> $env:GITHUB_OUTPUT
          } else {
            "path=$sig" >> $env:GITHUB_OUTPUT
          }
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipName = "NatumHub_${version}_x64-setup.nsis.zip"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          "url=$base/$zipName" >> $env:GITHUB_OUTPUT

      - name: Update updater manifest
        shell: pwsh
        run: |
          $args = @(
            "scripts/update-updater-manifest.mjs",
            "--channel", "stable",
            "--version", "${{ steps.meta.outputs.version }}",
            "--url", "${{ steps.sig.outputs.url }}",
            "--notes", "${{ steps.meta.outputs.notes }}"
          )
          if ("${{ steps.sig.outputs.path }}") {
            $args += @("--sig", "${{ steps.sig.outputs.path }}")
          }
          node @args

      - name: Upload updater manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" "updater-stable.json" --clobber

      - name: Copy updater manifest to Saves (server seed)
        shell: bash
        run: |
          mkdir -p Saves/updater-manifests
          cp "updater-stable.json" "Saves/updater-manifests/updater-stable.json"
