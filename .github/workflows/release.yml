name: Release NatumHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da release (ex. v0.0.12). Obrigatório no dispatch manual.'
        required: true
        type: string
      release_notes:
        description: 'Notas da versão (opcional)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - name: Detect version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if echo "$TAG" | grep -qiE 'alpha|beta'; then
            echo "Tags alpha/beta não são suportadas. Use vX.Y.Z."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="NatumHub $VERSION"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version in project files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const v = process.env.RELEASE_VERSION;
          const tauriPath = 'Backend/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = v;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');
          for (const p of ['Frontend/package.json', 'Backend/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = v;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          }
          let cargo = fs.readFileSync('Backend/Cargo.toml', 'utf8');
          cargo = cargo.replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('Backend/Cargo.toml', cargo);
          NODE
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}

      - name: Apply channel config
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/apply-channel-config.mjs --channel ${{ matrix.channel }} --tag ${{ needs.meta.outputs.tag }}

      - name: Apply updater public key
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/apply-updater-pubkey.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Install backend (Tauri CLI) dependencies
        run: npm ci
        working-directory: Backend

      - name: Build Tauri (${{ matrix.channel }})
        working-directory: Backend
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Locate release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $channel = "${{ matrix.channel }}"
          # Backend/.cargo/config.toml usa target-dir = C:/natumhub no Windows local/CI
          $roots = @(
            "C:/natumhub/x86_64-pc-windows-msvc/release/bundle",
            "C:/natumhub/release/bundle",
            "Backend/target/x86_64-pc-windows-msvc/release/bundle",
            "Backend/target/release/bundle"
          )
          $exe = $null
          $sig = $null
          $pkg = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            Write-Host "Procurando em $root"
            if (-not $exe) {
              $exe = Get-ChildItem -Path "$root/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $pkg) {
              $pkg = Get-ChildItem -Path "$root/nsis/*.nsis.zip","$root/updater/*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $sig) {
              $sig = Get-ChildItem -Path "$root/nsis/*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $sig) {
              $sig = Get-ChildItem -Path "$root/nsis/*.nsis.zip.sig","$root/updater/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $exe) {
            Write-Error "Instalador .exe não encontrado (canal $channel)."
            exit 1
          }
          # Tauri 2 (createUpdaterArtifacts: true): updater usa o próprio .exe + .exe.sig
          if (-not $pkg) { $pkg = $exe }
          $tag = "${{ needs.meta.outputs.tag }}"
          $pkgName = $pkg.Name
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $urlName = [uri]::EscapeDataString($pkgName)
          "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          "pkg_name=$pkgName" >> $env:GITHUB_OUTPUT
          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "url=$base/$urlName" >> $env:GITHUB_OUTPUT
          if ($sig) {
            "sig_path=$($sig.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "Arquivo .sig não encontrado — configure TAURI_SIGNING_PRIVATE_KEY"
            "sig_path=" >> $env:GITHUB_OUTPUT
          }

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $args = @(
            "scripts/update-updater-manifest.mjs",
            "--channel", "${{ matrix.channel }}",
            "--version", "${{ needs.meta.outputs.version }}",
            "--url", "${{ steps.artifacts.outputs.url }}",
            "--notes", "${{ needs.meta.outputs.notes }}"
          )
          if ("${{ steps.artifacts.outputs.sig_path }}") {
            $args += @("--sig", "${{ steps.artifacts.outputs.sig_path }}")
          }
          node @args

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-staging/${{ matrix.channel }}" | Out-Null
          Copy-Item "${{ steps.artifacts.outputs.exe_path }}" "release-staging/${{ matrix.channel }}/"
          $pkg = "${{ steps.artifacts.outputs.pkg_path }}"
          $exe = "${{ steps.artifacts.outputs.exe_path }}"
          if ($pkg -and ($pkg -ne $exe)) {
            Copy-Item $pkg "release-staging/${{ matrix.channel }}/"
          }
          Copy-Item "updater-${{ matrix.channel }}.json" "release-staging/${{ matrix.channel }}/"

      - name: Upload channel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.channel }}
          path: release-staging/${{ matrix.channel }}/
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all channel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: List release files
        run: find release-files -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: NatumHub ${{ needs.meta.outputs.tag }}
          body: |
            ${{ needs.meta.outputs.notes }}

            ## Instaladores (primeira instalação)
            - **Principal:** `NatumHub_*_x64-setup.exe`
            - **Desenvolvedor:** `NatumHub Dev_*_x64-setup.exe` (supervisor)

            ## Atualização in-app
            Manifests `updater-stable.json` e `updater-dev.json` (URL do instalador `.exe` assinado).
            No PC master: Configurações → Atualizações → Sincronizar manifests do GitHub.
          draft: false
          prerelease: false
          files: release-files/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy manifests to Saves seed
        run: |
          mkdir -p Saves/updater-manifests
          cp release-files/updater-stable.json Saves/updater-manifests/updater-stable.json
          cp release-files/updater-dev.json Saves/updater-manifests/updater-dev.json
