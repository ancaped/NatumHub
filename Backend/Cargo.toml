[package]
name = "natum-hub"
version = "0.0.11"
description = "Natum Unified Hub"
authors = ["Natum"]
edition = "2021"
rust-version = "1.77.2"
default-run = "natum-hub"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-updater = "2.0.0"
tauri-plugin-process = "2.0.0"
base64 = "0.22.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
csv = "1.3"
uuid = { version = "1.20.0", features = ["v4"] }

# Axum and Tokio dependencies for Producao backend server
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
calamine = "0.24.0"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
anyhow = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
chrono = "0.4.38"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
flate2 = "1.0"
reqwest = { version = "0.12", features = ["json"] }
url = "2"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

