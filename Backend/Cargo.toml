[package]
name = "nexus"
version = "0.1.0"
description = "Nexus Industrial Hub"
authors = ["Nexus"]
edition = "2021"
rust-version = "1.77.2"
default-run = "nexus-server"
autobins = false

[[bin]]
name = "nexus-server"
path = "src/main.rs"

[[bin]]
name = "discover_laudos_erp"
path = "src/bin/discover_laudos_erp.rs"

[[bin]]
name = "regen_feedback_md"
path = "src/bin/regen_feedback_md.rs"




[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
csv = "1.3"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

# Axum and Tokio dependencies for Producao backend server
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1"
calamine = "0.24.0"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
anyhow = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.38", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
flate2 = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = "2"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
