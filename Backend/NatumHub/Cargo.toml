[package]
name = "natum-hub"
version = "0.0.2-alpha"
description = "Natum Unified Hub"
authors = ["Natum"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.1", features = [] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
csv = "1.3"
uuid = { version = "1.20.0", features = ["v4"] }

# Axum and Tokio dependencies for Producao backend server
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
calamine = "0.24.0"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
anyhow = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
chrono = "0.4.38"
